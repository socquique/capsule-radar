; Capsule Radar
;
; Environments:
;   esp32-s3-amoled-175  -> firmware for the reference Waveshare ESP32-S3-Touch-AMOLED-1.75
;   esp32-s3-amoled-143  -> firmware for the Waveshare ESP32-S3-Touch-AMOLED-1.43
;   esp32-s3-lcd-21      -> firmware for the Waveshare ESP32-S3-Touch-LCD-2.1
;   native               -> desktop LVGL simulator (SDL2), runs the same UI on the Mac
;
; The two board envs share everything except a -DBOARD_* flag; the pin map, panel
; gaps, touch driver and peripheral set live in src/boards/board_*.h.
;
; Build/run the simulator:   pio run -e native -t exec
; Build/flash the device:    pio run -e esp32-s3-amoled-175 -t upload
;                            pio run -e esp32-s3-amoled-143 -t upload

[amoled_common]
; pioarduino fork of the espressif32 platform (Arduino core 3.x / ESP-IDF 5.x).
; This exact release is what the reference board builds use and is already installed
; locally; swap to "espressif32" (registry) if you prefer the official platform.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13/platform-espressif32.zip
board = esp32-s3-devkitc-1      ; generic S3; both boards are 8MB PSRAM / 16MB flash
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600

; sim_main.cpp is desktop-only (has its own main() + SDL); keep it out of the firmware
build_src_filter = +<*> -<sim_main.cpp>

; ESP32-S3R8: QIO flash + OPI PSRAM, 16 MB flash + matching partition table
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0              ; silence Arduino library [E] spam (Wire I2C -1/263, ssl_client);
                                      ;   our own Serial.printf [adsb]/[gps]/[wifi] logs are unaffected
    -DPNG_MAX_BUFFERED_PIXELS=8192    ; 512px RGBA scanlines need (512*4+1)*2 = 4098, but sizing the
                                      ;   buffer EXACTLY let PNGdec run past it inside its PSRAM object,
                                      ;   silently corrupting the neighbouring heap block (weather image
                                      ;   corruption bands, random hangs, intermittent fetch failures —
                                      ;   a different victim every boot). 2x headroom fixes it. Found by
                                      ;   @ijord with CONFIG_HEAP_POISONING on his 2.8-inch port.
    -DLV_CONF_INCLUDE_SIMPLE          ; LVGL does #include "lv_conf.h"
    -I"${PROJECT_DIR}/include"        ; ...and finds it here (PIO's auto include/ is not on the LIBRARY path)
    -std=gnu++17
build_unflags = -std=gnu++11

lib_deps =
    moononournation/GFX Library for Arduino @ 1.6.4   ; has Arduino_CO5300 + Arduino_ESP32QSPI
    lvgl/lvgl @ 8.4.0                                  ; lv_conf.h in include/ targets v8
    bblanchon/ArduinoJson @ ^7.0.4
    https://github.com/tzapu/WiFiManager.git
    lewisxhe/XPowersLib                               ; AXP2101 battery gauge
    bodmer/TJpg_Decoder                               ; JPEG decode for aircraft photos
    mikalhart/TinyGPSPlus                             ; NMEA parsing for the LC76G GPS (-G variant)
    bitbank2/PNGdec                                   ; decode RainViewer radar tiles into RGB565
; Notes:
; - lv_conf.h lives in include/ (added to the include path above).
; - Versions are pinned to a known-good combination for this panel; bump deliberately.

; --- Board: Waveshare ESP32-S3-Touch-AMOLED-1.75 (reference) -----------------
[env:esp32-s3-amoled-175]
extends = amoled_common
; no -DBOARD_* flag: src/config.h defaults to the 1.75 board header.

; --- Board: Waveshare ESP32-S3-Touch-AMOLED-1.43 -----------------------------
; Same SoC, PSRAM and flash as the 1.75, but a different pin map, an FT3168 touch
; controller instead of the CST9217, and no PMIC/audio codec. See
; src/boards/board_amoled_143.h -- those pins are confirmed on hardware.
[env:esp32-s3-amoled-143]
extends = amoled_common
build_flags =
    ${amoled_common.build_flags}
    -DBOARD_AMOLED_143

; --- OTA upload (flash over WiFi) -------------------------------------------
; Device must be powered and on WiFi. Then:  pio run -e esp32-s3-amoled-175-ota -t upload
[env:esp32-s3-amoled-175-ota]
extends = env:esp32-s3-amoled-175
upload_protocol = espota
upload_port = capsuleradar.local

; --- Waveshare ESP32-S3-Touch-LCD-2.1 (ST7701 480x480 RGB, CST820 touch) ------
; Same MCU (ESP32-S3R8, 8MB OPI PSRAM / 16MB flash) as the AMOLED board, so memory
; settings match. The display/touch differ entirely — selected by -DBOARD_LCD21,
; which switches config.h + pulls in display_st7701.cpp / touch_cst820.cpp / tca9554.cpp
; The other panel/touch drivers self-exclude for this board.
; Build/flash:  pio run -e esp32-s3-lcd-21 -t upload
[env:esp32-s3-lcd-21]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600

build_src_filter = +<*> -<sim_main.cpp>

board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
; custom_sdkconfig builds in ESP-IDF component mode, which can't resolve the framework's
; built-in "default_16MB.csv" by name — point at an in-repo copy instead.
board_build.partitions = partitions_16MB.csv

build_flags =
    -DBOARD_LCD21                    ; selects the ST7701/RGB/CST820 code paths in config.h + drivers
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0
    -DPNG_MAX_BUFFERED_PIXELS=8192    ; match AMOLED envs: PNGdec scanline buffer headroom (see amoled_common)
    -DLV_CONF_INCLUDE_SIMPLE
    -I"${PROJECT_DIR}/include"
    -std=gnu++17
build_unflags = -std=gnu++11

; RGB-LCD + WiFi coexistence (the crux of this board's bring-up): WiFi's flash
; operations disable the CPU cache on both cores, and the RGB panel's interrupts
; (the VSYNC handler, and the bounce-buffer refill) can fire in that window.
; The refill copies from the framebuffer in PSRAM, which is unreachable while the
; cache is off, so these ISRs must NOT be IRAM-safe: left non-IRAM, the system holds
; them off until the flash operation ends instead of running them with the cache off
; ("Cache disabled but cached memory region accessed" panic). The cost is that a long
; flash write (a settings save, OTA) can briefly starve the panel of a few lines.
; NOTE: custom_sdkconfig rebuilds the ESP-IDF libraries -> much slower builds.
custom_sdkconfig =
    CONFIG_LCD_RGB_ISR_IRAM_SAFE=n
    CONFIG_GDMA_ISR_IRAM_SAFE=n
    CONFIG_GDMA_CTRL_FUNC_IN_IRAM=y
    ; RESTART_IN_VSYNC stays OFF. With it on, IDF 5.3.2 never resets the bounce-buffer EOF
    ; count, and the driver picks the buffer to refill by its parity: an odd number of EOF
    ; interrupts held off by a flash op leaves the refill one buffer out of step for good
    ; (jitter in the top of the picture until the panel is re-initialized or the board
    ; reboots; espressif/esp-idf#19070, fixed in IDF c0fb05b37e, not yet released). Off,
    ; the driver resets the count at every VSYNC and restarts the DMA only when EOFs were
    ; lost.
    CONFIG_LCD_RGB_RESTART_IN_VSYNC=n
    CONFIG_ARDUINO_LOOP_STACK_SIZE=16384 ; bigger Arduino loop() stack: LVGL render + the 5s HUD update run here; IDF-mode default can be too small
    ; ESP-IDF component mode regenerates sdkconfig from IDF defaults and drops the
    ; Arduino board's PSRAM setup, so it probed the 8 MB *octal* (OPI) PSRAM as quad
    ; -> "wrong PSRAM line mode" -> 0 bytes -> no framebuffer, no web-page buffer, TLS
    ; starves. Restore octal PSRAM @80 MHz + heap allocator.
    CONFIG_SPIRAM=y
    CONFIG_SPIRAM_MODE_OCT=y
    CONFIG_SPIRAM_SPEED_80M=y
    CONFIG_SPIRAM_USE_MALLOC=y
    ; Let WiFi/LWIP buffers fall back to PSRAM, as they do on the AMOLED boards. They were
    ; kept in internal RAM because the RGB panel's DMA read PSRAM continuously and sharing it
    ; with WiFi buffers caused flaky connects and an unreachable web server. With the bounce
    ; buffer (display_st7701.cpp) the panel streams from internal RAM instead, and keeping
    ; WiFi in internal RAM let bursts of LAN broadcast/multicast traffic drain it by tens of KB.
    CONFIG_SPIRAM_TRY_ALLOCATE_WIFI_LWIP=y
    CONFIG_ESPTOOLPY_FLASHSIZE_16MB=y

; In IDF component mode arduino-esp32 pulls a pile of managed components we don't use
; (speech recognition, insights, diagnostics, rainmaker, matter...). They bloat the build
; and one of them (esp_insights) embeds a cert via a generated .S target that isn't
; produced here -> "https_server.crt.S not found". Strip them.
custom_component_remove =
    espressif/esp_insights
    espressif/esp-sr
    espressif/esp_diagnostics
    espressif/esp_diag_data_store
    espressif/esp_rainmaker
    espressif/rmaker_common
    espressif/esp_matter
    ; espressif/esp-dsp — keep: PNGdec's S3 SIMD assembly (s3_simd_rgb565.S) includes dsps_fft2r_platform.h
    espressif/network_provisioning
    espressif/esp_modem

; No Arduino_GFX here — the RGB panel is driven straight through esp_lcd (ESP-IDF).
; PMIC and audio support compile to stubs through the board capability flags.
lib_deps =
    lvgl/lvgl @ 8.4.0
    bblanchon/ArduinoJson @ ^7.0.4
    https://github.com/tzapu/WiFiManager.git
    lewisxhe/XPowersLib
    bodmer/TJpg_Decoder
    mikalhart/TinyGPSPlus
    bitbank2/PNGdec                                   ; decode RainViewer radar tiles into RGB565

[env:esp32-s3-lcd-21-ota]
extends = env:esp32-s3-lcd-21
upload_protocol = espota
upload_port = capsuleradar.local

[env:esp32-s3-amoled-143-ota]
extends = env:esp32-s3-amoled-143
upload_protocol = espota
upload_port = capsuleradar.local

; --- Desktop LVGL simulator (SDL2) -------------------------------------------
[env:native]
platform = native
; Only the portable UI + the SDL sim main; no Arduino_GFX / WiFi / device code.
build_src_filter = -<*> +<radar_view.cpp> +<ui.cpp> +<route.cpp> +<photo.cpp> +<weather.cpp> +<wx_radar.cpp> +<cloud_image.cpp> +<coastline.cpp> +<airports.cpp> +<sim_main.cpp>
build_flags =
    !sdl2-config --cflags --libs      ; SDL2 include/lib flags (Homebrew sdl2)
    -DLV_CONF_INCLUDE_SIMPLE
    -I"${PROJECT_DIR}/include"
    -DLV_LOG_PRINTF=1
    -std=gnu++17
lib_deps =
    lvgl/lvgl @ 8.4.0
